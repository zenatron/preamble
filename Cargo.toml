[package]
name = "preamble"
version = "0.9.1"
edition = "2024"
repository = "https://github.com/zenatron/preamble"

[dependencies]
lofty = "0.22"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
ratatui = "0.29"
crossterm = "0.28"
blake3 = "1"
humansize = "2.1.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
notify = "6"
csv = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# Force bundled SQLite for cross-compilation (dist CI images may lack system sqlite3-dev)
[dependencies.libsqlite3-sys]
version = "0.30"
features = ["bundled"]
# Don't link to system sqlite — compile from source
# so cross-compilation to aarch64-unknown-linux-gnu and
# x86_64-pc-windows-msvc works without headers installed.

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
